name: Download 1 year BTCUSDT 1m OHLCV

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/download-btcusdt-1m-year.yml"

permissions:
  contents: write

concurrency:
  group: download-btcusdt-1m-year
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and combine last 365 complete days
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import gzip
          import io
          import os
          import time
          import urllib.error
          import urllib.request
          import zipfile

          symbol = "BTCUSDT"
          interval = "1m"
          # Use the 365 complete UTC days ending yesterday.
          today = dt.datetime.now(dt.timezone.utc).date()
          end_day = today - dt.timedelta(days=1)
          start_day = end_day - dt.timedelta(days=364)
          out_dir = "data/spot/btcusdt/1m"
          os.makedirs(out_dir, exist_ok=True)
          out_path = f"{out_dir}/BTCUSDT-1m-{start_day.isoformat()}_{end_day.isoformat()}.csv.gz"
          header = ["open_time", "open", "high", "low", "close", "volume",
                    "close_time", "quote_asset_volume", "number_of_trades",
                    "taker_buy_base_asset_volume", "taker_buy_quote_asset_volume", "ignore"]
          total_rows = 0
          missing = []

          with gzip.open(out_path, "wt", encoding="utf-8", newline="") as out:
              writer = csv.writer(out)
              writer.writerow(header)
              day = start_day
              while day <= end_day:
                  filename = f"{symbol}-{interval}-{day.isoformat()}.zip"
                  url = f"https://data.binance.vision/data/spot/daily/klines/{symbol}/{interval}/{filename}"
                  request = urllib.request.Request(url, headers={"User-Agent": "BTC-OHLCV-data-downloader/1.0"})
                  payload = None
                  for attempt in range(4):
                      try:
                          with urllib.request.urlopen(request, timeout=45) as response:
                              payload = response.read()
                          break
                      except urllib.error.HTTPError as exc:
                          if exc.code == 404:
                              missing.append(day.isoformat())
                              break
                          if attempt == 3:
                              raise
                          time.sleep(2 ** attempt)
                      except Exception:
                          if attempt == 3:
                              raise
                          time.sleep(2 ** attempt)

                  if payload:
                      with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                          csv_names = [n for n in archive.namelist() if n.lower().endswith(".csv")]
                          if not csv_names:
                              raise RuntimeError(f"No CSV found in {filename}")
                          with archive.open(csv_names[0]) as raw:
                              reader = csv.reader(io.TextIOWrapper(raw, encoding="utf-8", newline=""))
                              for row in reader:
                                  if row:
                                      writer.writerow(row)
                                      total_rows += 1
                  day += dt.timedelta(days=1)

          print(f"Output: {out_path}")
          print(f"UTC date range: {start_day} through {end_day}")
          print(f"Rows downloaded: {total_rows:,}")
          print(f"Missing daily archives: {len(missing)}")
          if missing:
              print("Missing dates: " + ", ".join(missing))
          if total_rows < 500_000:
              raise RuntimeError(f"Expected about 525,600 one-minute rows; only got {total_rows:,}. Refusing to commit incomplete data.")
          PY

      - name: Commit dataset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spot/btcusdt/1m/*.csv.gz
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "data: add one year of Binance BTCUSDT 1m OHLCV"
            git push
          fi
