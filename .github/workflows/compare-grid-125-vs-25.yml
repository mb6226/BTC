name: Compare BTCUSDT 1.25% vs 2.5% Grid
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/compare-grid-125-vs-25.yml"
      - "scripts/backtest_grid_125_vs_25.py"

permissions:
  contents: write

concurrency:
  group: compare-btcusdt-grid-125-vs-25
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculate 1.25% and recompute 2.5% comparison
        run: python scripts/backtest_grid_125_vs_25.py
      - name: Commit comparison results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/grid_spacing_125_vs_25/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "results: compare 1.25% and 2.5% BTCUSDT grids"
            git pull --rebase origin main
            git push
          fi
      - name: Upload detailed outputs
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-grid-125-vs-25
          path: results/grid_spacing_125_vs_25/
          if-no-files-found: error
